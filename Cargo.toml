[package]
name = "solar-system-ascii"
version = "1.8.0"
edition = "2021"
authors = ["PedroSmaxY <pedrohenrique.nv@icloud.com>"]
description = "solar-system-ascii (AstroEngine) - Real-time 3D Solar System simulator in TrueColor ANSI Half-Block raymarching"
repository = "https://github.com/PedroSmaxY/solar-system-ascii"
license = "MIT"
keywords = ["solar-system", "ascii", "astronomy", "terminal", "raymarching"]
categories = ["command-line-utilities", "science", "simulation", "rendering"]

[dependencies]
crossterm = "0.28"
rayon = "1.10"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
